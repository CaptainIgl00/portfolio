name: deploy-portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🔨 Install dependencies and build
        run: |
          npm ci
          npm run build

      # Un prerender qui échoue peut faire sortir Nuxt en code 0 avec un
      # `.output/public` amputé de ses assets : on refuse de déployer ça.
      - name: ✅ Verify build output
        run: |
          set -euo pipefail
          for path in .output/public/index.html .output/public/_nuxt .output/server/index.mjs; do
            if [ ! -e "$path" ]; then
              echo "::error::Build output incomplet : $path est absent"
              exit 1
            fi
          done
          for route in about contact projects; do
            if [ ! -f ".output/public/$route/index.html" ]; then
              echo "::error::Route prérendue manquante : /$route"
              exit 1
            fi
          done
          entries=$(find .output/public/_nuxt -name '*.js' | wc -l)
          if [ "$entries" -lt 5 ]; then
            echo "::error::Seulement $entries bundles JS dans _nuxt, build suspect"
            exit 1
          fi
          echo "Build output OK ($entries bundles JS)"

      - name: 🔑 Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          REL=$(date +%Y%m%d-%H%M%S)
          echo "🚀 Deploying release: $REL"
          
          # Create releases directory if it doesn't exist
          ssh -i ~/.ssh/key $SSH_USER@$SSH_HOST "mkdir -p /srv/www/portfolio/releases"
          
          # Upload new release
          rsync -az --delete -e "ssh -i ~/.ssh/key" .output/public/ $SSH_USER@$SSH_HOST:/srv/www/portfolio/releases/$REL/
          
          # Activate new release and cleanup old ones (keep 3)
          ssh -i ~/.ssh/key $SSH_USER@$SSH_HOST "ln -sfn /srv/www/portfolio/releases/$REL /srv/www/portfolio/current && \
             find /srv/www/portfolio/releases -mindepth 1 -maxdepth 1 -type d | sort | head -n -3 | xargs -r rm -rf"
          
          echo "✅ Successfully deployed release: $REL"

      - name: 🔍 Verify deployment
        run: |
          sleep 5
          curl -sI https://champagnedevops.fr | head -n 1 || echo "⚠️ Site not yet accessible, DNS might still be propagating"